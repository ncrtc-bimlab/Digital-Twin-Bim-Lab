services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: twin-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: twin-db
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin_dev_pw
      POSTGRES_DB: twin
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: twin-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mosquitto_data:
  timescale_data:
  redis_data:
